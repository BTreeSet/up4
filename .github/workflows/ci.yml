name: ci

# up4's definition of done for a change (AGENTS.md): tests green, clippy clean,
# formatting unchanged, and the unprivileged/`unsafe` invariants still holding.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no job gets a token at all unless it says so, and each one
# below restates exactly what it needs. `pull_request` (never
# `pull_request_target`) means fork code runs without repository write access.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test, clippy, fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Nothing here pushes, and CI compiles and runs pull-request code —
          # including whatever build scripts it brings. Leaving the token in
          # .git/config (the action's default) would hand it to them.
          persist-credentials: false
          # The skills submodule is editor tooling, not part of the build.
          submodules: false

      # rust-toolchain.toml pins the version; rustup honours it, so no action
      # is needed to select one.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      # Cache trust boundary: pull requests restore, only pushes to main save.
      #
      # `save-if` defaults to true, so without this a pull-request run writes a
      # cache of its own build output. GitHub scopes that write to the PR's own
      # ref — main cannot restore it ("Workflow runs cannot restore caches
      # created for child branches or sibling branches") — but it can still
      # poison later runs *of that same pull request*, and it competes for the
      # repository's shared cache quota, evicting entries main depends on.
      # GitHub's own guidance for read-only-cache triggers is the same shape:
      # let a `push` workflow do the saving and let everything else restore.
      #
      # The key is *exactly* the name of the cargo profile whose artifacts the
      # entry holds, and each job builds exactly one profile — `dev` here
      # (`cargo test` and `cargo clippy` build with the `test` profile, which
      # takes `dev`'s settings and so shares its artifacts), `release` in the
      # job below.
      #
      # This is an invariant, not a convention: crates/up4d/tests/ci_cache_keys.rs
      # fails the build if a key is not a declared profile, if a keyed job
      # builds any other profile, or if a job with no build claims an entry.
      # New profiles are the supported way to grow — declare `[profile.<name>]`
      # in the workspace manifest and `<name>` becomes a legal key with no
      # change to the test.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (oracle feature)
        run: cargo clippy --workspace --all-targets --features up4d/oracle -- -D warnings

      # The end-to-end tests bind loopback ports and spawn up4d processes, all
      # as an ordinary user — which is the point (spec S1.1).
      #
      # This also runs the repository's own invariants, which are tests rather
      # than workflow steps so that they hold on a developer's machine too:
      # crates/up4d/tests/unsafe_audit.rs (spec S1.7, A7 — every use of
      # `unsafe` is on an allowlist, with an exact site count and a warrant
      # that must be true of the path) and crates/up4d/tests/ci_cache_keys.rs
      # (a cache key is exactly the profile whose artifacts it holds).
      - name: Test
        run: cargo test --workspace

      - name: Conformance corpora are current
        run: python3 tools/corpus/gen_corpus.py --check

      # Spec S1.1: no capabilities, no sysctls, no raw sockets, no TUN/TAP, no
      # namespaces — not required and not attempted.
      - name: Audit privileged interfaces
        run: |
          if grep -rnE 'CAP_NET|setcap|sysctl -w|SOCK_RAW|/dev/net/tun|unshare\(|setns\(' \
              crates/ tools/ benches/ --include='*.rs' --include='*.py'; then
            echo "::error::privileged interface referenced (spec S1.1)"
            exit 1
          fi
          echo "no privileged interfaces referenced"

      # Debug on purpose: this is a diagnostic print, and a release build here
      # would put release artifacts in the `dev` cache entry.
      - name: Probe this runner
        run: cargo run -p up4-tools --bin probe -- --peer 127.0.0.1 --pretty

  p4:
    name: p4 sources match their artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false

      # The `.p4` files are the artifact of record (spec P1) and two backends
      # are compiled from them, so the failure this job exists to catch is a
      # source edited without regenerating.
      #
      # `audit` answers exactly that and needs no compiler: it hashes each
      # `.p4` against the value recorded in p4/generated.lock when the artifact
      # was produced. Seconds, on any machine.
      #
      # The stronger check — regenerate and compare bytes — has to build both
      # P4 compilers from source, which does not fit in a pull-request job and
      # would be killed by cancel-in-progress anyway. It lives in
      # p4-artifacts.yml, on a schedule, with the time it needs.
      - name: Sources match the artifacts generated from them
        run: cargo xtask audit

  smoke:
    name: two routers on loopback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false

      # `release`, for the same reason the other job's key is `dev`: the key
      # names the profile in the entry. `cargo bench` would belong here too —
      # the `bench` profile inherits `release`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --workspace

      # The same topology the end-to-end tests bring up, driven by the real
      # binaries so the demo script itself stays honest.
      - name: Demo
        run: ./scripts/demo.sh
