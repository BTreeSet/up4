[workspace]
resolver = "3"
members = [
    "crates/up4-wire",
    "crates/up4-config",
    "crates/up4-metrics",
    "crates/up4-engine",
    "crates/up4-io",
    "crates/up4-ctl",
    "crates/up4d",
    "crates/up4-tools",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/oxidecomputer/up4"
rust-version = "1.97"

# Closed dependency list (spec S2). Anything not here needs an in-code TODO
# citing the spec section that forces it.
[workspace.dependencies]
up4-wire = { path = "crates/up4-wire" }
up4-config = { path = "crates/up4-config" }
up4-metrics = { path = "crates/up4-metrics" }
up4-engine = { path = "crates/up4-engine" }
up4-io = { path = "crates/up4-io" }
up4-ctl = { path = "crates/up4-ctl" }
up4-tools = { path = "crates/up4-tools" }

quinn-udp = { version = "0.6", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
core_affinity = "0.8"
criterion = "0.8"
etherparse = "0.21"

[profile.release]
panic = "abort"       # spec S12: a half-alive switch corrupts experiments
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
